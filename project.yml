name: BrowserSelector
options:
  bundleIdPrefix: com.zyl
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  BrowserSelectorPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES

targets:
  BrowserSelector:
    type: application
    platform: macOS
    sources:
      - path: Sources/BrowserSelector
    dependencies:
      - package: BrowserSelectorPackage
        product: BrowserSelectorCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh_CN
        CFBundleDisplayName: 浏览器选择器
        CFBundleExecutable: BrowserSelector
        CFBundleIdentifier: com.zyl.BrowserSelector
        CFBundleName: BrowserSelector
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyl.BrowserSelector
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  BrowserSelectorCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BrowserSelectorCoreTests
    dependencies:
      - package: BrowserSelectorPackage
        product: BrowserSelectorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyl.BrowserSelectorCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BrowserSelector:
    build:
      targets:
        BrowserSelector: all
        BrowserSelectorCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrowserSelectorCoreTests
